version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce}
      POSTGRES_USER: ${DB_USER:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - /mnt/Storage3/ecommerce-deployment/data/postgres:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ecommerce} -d ${DB_NAME:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecommerce-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${DB_USER:-ecommerce}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - /mnt/Storage3/ecommerce-deployment/data/media:/app/public/media
      - /mnt/Storage3/ecommerce-deployment/logs:/app/logs
    networks:
      - ecommerce-net
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/Storage3/ecommerce-deployment/data/static:/var/www/static:ro
      - /mnt/Storage3/ecommerce-deployment/data/media:/var/www/media:ro
      - /mnt/Storage3/ecommerce-deployment/logs/nginx:/var/log/nginx
    networks:
      - ecommerce-net
    depends_on:
      - app

networks:
  ecommerce-net:
    driver: bridge

# Persistent data stored on /mnt/Storage3 (not in Docker volumes)
# This survives container rebuilds and is easy to backup
